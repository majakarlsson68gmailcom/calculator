<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="div main-container">

        <div class="display">
            <span class="prev-operand"></span>
            <div class="current-operand"></div>
        </div>

        <div class="button-container">

            <button data-value="⌫">⌫</button>
            <button data-value="AC">AC</button>
            <button data-value="7">%</button>
            <button class="operand" data-value="÷">÷</button>

            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operand" data-value="×">×</button>

            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operand" data-value="−">−</button>

            <button class="number" data-value="3">3</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="1">1</button>
            <button class="operand" data-value="+">+</button>

            <button class="number" data-value="±">±</button>
            <button class="number" data-value="0">0</button>
            <button class="number" data-value=".">.</button>
            <button class="operand" data-value="=">=</button>


        </div>

    </div>
    
</body>
</html>
